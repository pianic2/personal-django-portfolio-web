[project]
name = "personal-django-portfolio-web"
version = "0.1.0"
description = "Django and Wagtail backend for the personal portfolio."
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portfolio.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
